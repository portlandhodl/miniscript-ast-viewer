[package]
name = "miniscript-ast-viewer"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "WASM miniscript policy/descriptor analyzer and AST browser backend"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
miniscript = { version = "13.1", features = ["compiler"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
